<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CCTV Sync app information and privacy policy.">
  <meta name="theme-color" content="#101827">
  <title>CCTV Sync</title>
  <style>
    :root { color-scheme: dark; --bg: #101827; --panel: #182438; --text: #f3f6fb; --muted: #b6c2d3; --accent: #79b8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: radial-gradient(ellipse at top, #203653, var(--bg) 62%); color: var(--text); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 720px); padding: clamp(2rem, 7vw, 4rem); border: 1px solid #33445d; border-radius: 24px; background: color-mix(in srgb, var(--panel) 92%, transparent); box-shadow: 0 24px 80px #0005; }
    .icon { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 1.5rem; border-radius: 16px; background: #24466a; color: var(--accent); font-size: 1.6rem; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.1; letter-spacing: -.04em; }
    p { color: var(--muted); font-size: 1.1rem; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
    a { color: var(--accent); }
    nav a { display: inline-block; padding: .8rem 1.1rem; border: 1px solid #49627f; border-radius: 10px; text-decoration: none; font-weight: 650; }
    nav a:hover, nav a:focus-visible { background: #24466a; }
    footer { margin-top: 2.5rem; color: #91a1b6; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">◉</div>
    <h1>CCTV Sync</h1>
    <p>Welcome to the official information page for CCTV Sync.</p>
    <p>Find out how information is handled when you use CCTV Sync by reading our privacy policy.</p>
    <nav aria-label="Site links">
      <a href="privacy.html">Privacy policy</a>
      <a href="https://github.com/iteachtolearn/CCTV-Sync/issues">Contact / support</a>
    </nav>
    <footer>© 2026 CCTV Sync</footer>
  </main>
</body>
</html>
